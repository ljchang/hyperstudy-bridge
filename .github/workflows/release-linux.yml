name: Build Linux Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            libudev-dev \
            cmake \
            build-essential

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-release

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --bundles appimage

      - name: Prepare artifacts
        id: artifacts
        run: |
          # Find the AppImage
          APPIMAGE_PATH=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" -type f | head -1)
          echo "Found AppImage: $APPIMAGE_PATH"

          # Get just the filename
          APPIMAGE_NAME=$(basename "$APPIMAGE_PATH")

          # Rename for clarity with version
          NEW_NAME="HyperStudy-Bridge-${{ inputs.version }}-x86_64-linux.AppImage"
          cp "$APPIMAGE_PATH" "$NEW_NAME"

          echo "appimage_path=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: ${{ steps.artifacts.outputs.appimage_path }}
          retention-days: 7

      - name: Prepare updater artifacts
        id: updater_artifacts
        run: |
          # Find the .AppImage.tar.gz updater artifact
          TARGZ_PATH=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage.tar.gz" -type f | head -1)
          SIG_PATH="${TARGZ_PATH}.sig"

          if [ -n "$TARGZ_PATH" ] && [ -f "$TARGZ_PATH" ]; then
            TARGZ_NAME="HyperStudy-Bridge-${{ inputs.version }}-x86_64-linux.AppImage.tar.gz"
            SIG_NAME="${TARGZ_NAME}.sig"
            cp "$TARGZ_PATH" "$TARGZ_NAME"

            if [ -f "$SIG_PATH" ]; then
              cp "$SIG_PATH" "$SIG_NAME"
              echo "sig_path=$SIG_NAME" >> $GITHUB_OUTPUT
            else
              echo "Warning: No .sig file found for updater artifact"
            fi

            echo "targz_path=$TARGZ_NAME" >> $GITHUB_OUTPUT
            echo "Updater artifact: $TARGZ_NAME"
          else
            echo "Warning: No updater .AppImage.tar.gz artifact found"
          fi

      - name: Upload updater artifact
        if: steps.updater_artifacts.outputs.targz_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: updater-linux
          path: |
            ${{ steps.updater_artifacts.outputs.targz_path }}
            ${{ steps.updater_artifacts.outputs.sig_path }}
          retention-days: 7
